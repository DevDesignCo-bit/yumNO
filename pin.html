<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8ee" />
    <meta name="description" content="Bekreft Yumetics-abonnementet ditt." />
    <title>Yumetics – Bekreftelse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen pin-screen" aria-label="Yumetics – PIN-bekreftelse">
      <img class="screen-art" src="MSISDN.jpg" alt="Yumetics. Skriv inn PIN-koden din." />
      <form class="phone-form pin-form" action="homepage.html" method="get">
        <label class="sr-only" for="pin">PIN-kode</label>
        <div class="pin-field"><input id="pin" name="pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4}" maxlength="4" required /></div>
        <button type="submit">BETAL NÅ</button>
      </form>
      <a class="terms-link" href="terms.html" aria-label="Vilkår og betingelser"></a>
    </main>
    <script>
      document.querySelector('#pin').addEventListener('input', (event) => {
        event.target.value = event.target.value.replace(/\D/g, '').slice(0, 4);
        event.target.closest('.pin-field').classList.toggle('has-value', event.target.value.length > 0);
      });
    </script>
  </body>
</html>
